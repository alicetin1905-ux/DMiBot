name: Reset DMI bot account

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-run
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reset all coins
        run: node src/reset.js

      - name: Commit reset state
        run: |
          git config user.name "dmi-toolbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && echo "no state changes" && exit 0
          git commit -m "Reset DMI bot account"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
